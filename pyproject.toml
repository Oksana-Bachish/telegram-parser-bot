[project]
name = "telegram-bot-scraper"
version = "0.1.0"
description = "Asynchronous Telegram bot on aiogram for dynamic web scraping using Selenium WebDriver and BeautifulSoup4 with local JSON caching"
requires-python = ">=3.10"
dependencies = [
    'aiofiles==24.1.0',
    'aiogram==3.14.0',
    'aiohappyeyeballs==2.4.3',
    'aiohttp==3.10.10',
    'aiosignal==1.3.1',
    'annotated-types==0.7.0',
    'async-timeout==4.0.3',
    'attrs==24.2.0',
    'beautifulsoup4==4.12.3',
    'bs4==0.0.2',
    'certifi==2024.8.30',
    'cffi==1.17.1',
    'charset-normalizer==3.4.0',
    'colorama==0.4.6',
    'decorator==5.1.1',
    'exceptiongroup==1.2.2',
    'frozenlist==1.5.0',
    'h11==0.14.0',
    'idna==3.10',
    'lxml==5.3.0',
    'magic-filter==1.0.12',
    'multidict==6.1.0',
    'numpy==2.1.2',
    'outcome==1.3.0.post0',
    'pandas==2.2.3',
    'propcache==0.2.0',
    'py==1.11.0',
    'pycparser==2.22',
    'pydantic==2.9.2',
    'pydantic_core==2.23.4',
    'PySocks==1.7.1',
    'python-dateutil==2.9.0.post0',
    'python-dotenv==1.0.1',
    'pytz==2024.2',
    'requests==2.32.3',
    'retry==0.9.2',
    'selenium==4.26.1',
    'six==1.16.0',
    'sniffio==1.3.1',
    'sortedcontainers==2.4.0',
    'soupsieve==2.6',
    'tqdm==4.67.0',
    'trio==0.27.0',
    'trio-websocket==0.11.1',
    'typing_extensions==4.12.2',
    'tzdata==2024.2',
    'urllib3==2.2.3',
    'websocket-client==1.8.0',
    'wsproto==1.2.0',
    'yarl==1.17.1',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = { find = { exclude = ["json_files*", "png_for_readme*"] } }
